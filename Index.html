<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="vierwport" content="width=device-width, initial-scale=1.0">
    <title>Santnader</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="Formulario">
            <h1>Banco Santoandré</h1>
            <form id="meuForm" onsubmit="return false">

                <div class="inputbox">
                    <input required="required" type="text">
                    <span>Nome</span>
                    <i></i>
                </div>

                <div class="inputbox">
                    <input required="required" type="text">
                    <span>Sobrenome</span>
                    <i></i>
                </div>

                <div class="inputbox">
                    <input required="required" type="text" inputmode="numeric" maxlength="14" placeholder=" " autocomplete="off" id="cpf">
                    <span>CPF</span>
                    <i></i>
                </div>

                <div class="inputbox">
                    <input required="required" type="text" inputmode="numeric" maxlength="19" placeholder=" " autocomplete="cc-number" id="cartao">
                    <span>Numero do cartão</span>
                    <i></i>
                </div>

                <div class="umalinha">
                    <div class="inputcurto">
                        <div class="inputbox">
                            <input required="required" type="text" inputmode="numeric" maxlength="3" placeholder=" " id="cvv">
                            <span>CVV</span>
                            <i></i>
                        </div>
                    </div>

                        <div class="vencimento">
                            <div class="inputcurto">
                                <div class="inputbox">
                                    <input required="required" type="number" inputmode="numeric" maxlength="2" placeholder=" " min="1" max="12" id="mes">
                                    <span>Mês</span>
                                    <i></i>
                                </div>
                            </div>
                    
                            <div class="inputcurto">
                                <div class="inputbox">
                                    <input required="required" type="number" inputmode="numeric" maxlength="4" placeholder=" " min="2026" max="3000" id="ano">
                                    <span>Ano</span>
                                    <i></i>
                                </div>
                            </div>
                        </div>
                </div>
                
                <div class="inputbox">
                    <input required="required" type="password">
                    <span>Senha do cartão</span>
                    <i></i>
                </div>

                    <button type="button" onclick="window.location.href='Haha.html'">
                    <p>Enviar</p>
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-6 w-6"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="4"
                    >
                        <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M14 5l7 7m0 0l-7 7m7-7H3"
                        ></path>
                    </svg>
                    </button>

            </form>

        </div>
        <div class="Quad">
             <div class="quadrado">
                <img id="logo" src="Source/Santander_Logo_0.svg" alt="Icone"/>
                <img id="logo2" src="Source/Santander_Logo_0 copy.svg" alt="Icone"/>
                <div class="texocaixa">
                    <h2>Pode confiar</h2>
                    <h4>Esse site é 100% confiável. Pode ter certeza.<br>As informações aqui contidas foram verificadas<br>por especialistas (eu mesmo) e são todas verdadeiras.<br>(definição de "verdadeiro" pode variar)</h4>
                </div>
                <div class="caixas" id="box1">
                    <div class="box" id="box1"></div>
                    <div class="box" id="box2"></div>
                    <div class="box" id="box2"></div>
                </div>
             </div>
        </div>
    </div>
    <div id="resultado"></div>
</body>
</html>
